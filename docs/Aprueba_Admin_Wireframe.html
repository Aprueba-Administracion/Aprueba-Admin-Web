:root{

  --bg:var(--fondo);--panel:#ffffff;--ink:var(--texto);--muted:#64748B;--line:#E2E8F0;--soft:#F1F5F9;
  --brand:var(--azul);--cta:var(--oro);--cta-ink:var(--azul);--accent:var(--exito);--warn:#F59E0B;--danger:var(--error);
  --chip:#EEF4FF;--shadow:0 8px 24px rgba(26,54,93,.08);
  --side:#0F2742;--side-ink:#E8EEF7;--side-mut:rgba(232,238,247,.6);--side-act:rgba(255,255,255,.12);

}
.dark{
  --bg:#0B1220;--panel:#131C2E;--ink:#E2E8F0;--muted:#94A3B8;--line:#1E2D45;--soft:#1A2540;
  --brand:#2D5A9E;--cta:#F5B041;--cta-ink:#1A365D;--accent:#34D399;--danger:#F87171;--chip:#1A2C4A;
  --shadow:0 8px 24px rgba(0,0,0,.5);--side:#0A1424;--side-ink:#E2E8F0;--side-mut:rgba(226,232,240,.55);--side-act:rgba(255,255,255,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--ink);font-size:14px;line-height:1.5;transition:background .25s}
h1,h2,h3,.h,.logo,.kpi-val{font-family:'Montserrat',sans-serif}
.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;transition:transform .25s}
.side-logo{display:flex;align-items:center;gap:9px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:18px;padding:18px 18px 6px}
.side-logo small{display:block;font-size:10px;font-weight:600;color:var(--side-mut);letter-spacing:.05em;font-family:'Inter'}
.nav{flex:1;padding:6px 12px;overflow-y:auto}
.nav-sec{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-mut);font-weight:700;padding:14px 10px 6px;font-family:'Montserrat',sans-serif}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--side-ink);cursor:pointer;margin-bottom:2px;border-left:3px solid transparent;transition:background .15s}
.nav-item:hover{background:var(--side-act)}
.nav-item.act{background:var(--side-act);border-left-color:var(--cta)}
.nav-item .ico{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-item .badge{margin-left:auto;font-size:9px;font-weight:800;background:var(--down);color:#fff;border-radius:10px;padding:1px 7px}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.side-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.side-avatar{width:34px;height:34px;border-radius:50%;background:var(--cta);color:#1A365D;display:grid;place-items:center;font-weight:800;font-family:'Montserrat';flex-shrink:0}
.side-user .nm{font-size:13px;font-weight:700}.side-user .rl{font-size:11px;color:var(--side-mut)}
.main-wrap{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hamb{display:none;background:var(--soft);border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:9px;font-size:18px;cursor:pointer}
.page-title{font-family:'Montserrat';font-weight:800;font-size:18px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.ctl{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 10px;font-size:12px;cursor:pointer;font-family:'Inter'}
.content{padding:22px;max-width:1280px;width:100%}
.h{font-size:18px;font-weight:700;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px}
.note{font-size:11.5px;color:var(--muted);line-height:1.5}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin:22px 0 8px;font-family:'Montserrat'}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--soft)}
.flex{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.divider{height:1px;background:var(--line);margin:14px 0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .kpi-val{font-size:27px;font-weight:800;color:var(--ink);margin-top:6px;line-height:1.1}
.kpi .dl{font-size:11px;font-weight:700;margin-top:4px}
.dl.up{color:var(--ok)}.dl.dn{color:var(--down)}
.tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--muted);display:inline-block}
.tag.g{background:var(--ok-bg);color:#059669}.tag.w{background:var(--deg-bg);color:#B45309}.tag.d{background:var(--down-bg);color:#DC2626}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}.dot.deg{background:var(--deg);box-shadow:0 0 0 3px var(--deg-bg)}.dot.down{background:var(--down);box-shadow:0 0 0 3px var(--down-bg)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);font-family:'Montserrat'}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--cta);color:var(--cta-ink);border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Montserrat'}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:12px}
input,select{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;color:var(--ink);font-family:'Inter';outline:none}
input:focus,select:focus{border-color:var(--brand)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:'Montserrat';flex-shrink:0}
.svc-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:10px}
.bar{height:7px;border-radius:5px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--brand);border-radius:5px}
/* plan builder */
.builder{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
.feat{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-top:8px;cursor:grab;font-size:12.5px;font-weight:600;transition:border-color .15s,box-shadow .15s}
.feat:hover{border-color:var(--brand)}
.feat.dragging{opacity:.4}
.feat .fi{font-size:15px;width:18px;text-align:center}
.plan-cols{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.plan-col{flex:1;min-width:210px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;flex-direction:column}
.plan-head{padding:14px;border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
.plan-head .pname{font-weight:800;font-family:'Montserrat';font-size:14px}
.plan-head .pprice{font-size:22px;font-weight:800;font-family:'Montserrat';margin-top:4px}
.dropzone{flex:1;padding:12px;min-height:120px;transition:background .15s}
.dropzone.over{background:rgba(26,54,93,.06);outline:2px dashed var(--brand);outline-offset:-6px;border-radius:10px}
.pfeat{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;background:var(--soft);margin-bottom:7px;font-size:12px;font-weight:600}
.pfeat .x{margin-left:auto;cursor:pointer;color:var(--muted);font-weight:800}
.pfeat .x:hover{color:var(--danger)}
.limits{padding:12px;border-top:1px solid var(--line)}
.limit-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.limit-row label{font-size:11.5px;color:var(--muted)}
.limit-row input{width:74px;text-align:center;padding:6px}
.empty-hint{font-size:11px;color:var(--muted);text-align:center;padding:18px 8px;border:1px dashed var(--line);border-radius:10px}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.span4,.span3{grid-column:span 2}}
@media(max-width:860px){.sidebar{position:fixed;z-index:30;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.3)}.sidebar.open{transform:translateX(0)}.hamb{display:grid;place-items:center}.scrim.open{display:block}.builder{grid-template-columns:1fr}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}.span2,.span3,.span4{grid-column:span 1}.content{padding:14px}}
</style>
</head>

// ── chart helpers (inline SVG) ──
function svgLine(vals,labels){const w=300,h=96,pad=8;const max=Math.max(...vals),min=Math.min(...vals),rng=(max-min)||1;
  const step=(w-pad*2)/(vals.length-1);const pts=vals.map((v,i)=>[pad+i*step,h-18-((v-min)/rng)*(h-30)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L${pts[pts.length-1][0].toFixed(1)} ${h-18} L${pad} ${h-18} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <path d="${area}" fill="var(--brand)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--brand)"/>`).join('')}
    ${labels.map((l,i)=>`<text x="${(pad+i*step).toFixed(1)}" y="${h-4}" font-size="8.5" fill="var(--muted)" text-anchor="middle" font-family="Inter">${l}</text>`).join('')}
  </svg>`;}
function svgBars(data){const w=300,h=140,bottom=20;const max=Math.max(...data.map(d=>d.value))||1;const n=data.length,slot=w/n,bw=Math.min(40,slot*0.5);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
   ${data.map((d,i)=>{const bh=(d.value/max)*(h-bottom-14);const x=slot*i+slot/2-bw/2;const y=h-bottom-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${bh.toFixed(1)}" rx="5" fill="${d.color||'var(--brand)'}"/>
     <text x="${(slot*i+slot/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="8.5" fill="var(--ink)" text-anchor="middle" font-family="Montserrat" font-weight="700">${d.disp||fmt(d.value)}</text>
     <text x="${(slot*i+slot/2).toFixed(1)}" y="${h-5}" font-size="8.5" fill="var(--muted)" text-anchor="middle" font-family="Inter">${d.label}</text>`;}).join('')}
  </svg>`;}
function svgDonut(pct){const r=40,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg viewBox="0 0 104 104" width="116" height="116"><circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/>
   <circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 52 52)"/>
   <text x="52" y="50" font-size="19" font-weight="800" fill="var(--ink)" text-anchor="middle" font-family="Montserrat">${pct}%</text>
   <text x="52" y="67" font-size="8" fill="var(--muted)" text-anchor="middle" font-family="Inter">conv.</text></svg>`;}
function svgHBars(data){const w=300,rowH=30,labW=130,max=Math.max(...data.map(d=>d.value))||1,h=data.length*rowH+4;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
   ${data.map((d,i)=>{const bw=(d.value/max)*(w-labW-46);const y=i*rowH+5;
    return `<text x="0" y="${y+14}" font-size="10" fill="var(--ink)" font-family="Inter">${d.label}</text>
     <rect x="${labW}" y="${y+4}" width="${Math.max(3,bw).toFixed(1)}" height="14" rx="4" fill="${d.color||'var(--brand)'}"/>
     <text x="${(labW+Math.max(3,bw)+5).toFixed(1)}" y="${y+15}" font-size="9" fill="var(--muted)" font-family="Inter">${d.disp}</text>`;}).join('')}
  </svg>`;}
function svgFunnel(data){const w=300,rowH=34,max=data[0].value,h=data.length*rowH+4;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
   ${data.map((d,i)=>{const bw=(d.value/max)*(w-10);const x=(w-bw)/2;const y=i*rowH+4;const op=1-i*0.16;
    return `<rect x="${x.toFixed(1)}" y="${y}" width="${bw.toFixed(1)}" height="${rowH-9}" rx="5" fill="var(--brand)" opacity="${op.toFixed(2)}"/>
     <text x="${(w/2).toFixed(1)}" y="${y+17}" font-size="10" fill="#fff" text-anchor="middle" font-family="Inter" font-weight="600">${d.label}: ${fmt(d.value)}</text>`;}).join('')}
  </svg>`;}

    <div class="card" style="position:sticky;top:78px"><b>${L('p_catalog')}</b><div class="note">${L('p_drag_hint')}</div>${catalog}</div>
    <div>
      <div class="flex between" style="margin-bottom:10px"><span></span><div class="flex" style="gap:8px"><button class="btn sec sm" onclick="addPlan()">${L('p_add_plan')}</button><button class="btn sm" onclick="savePlans()">${L('p_save')}</button></div></div>
      <div class="plan-cols" id="planCols">${APP.plans.map(planCol).join('')}</div>
    </div>
  </div>`;
};

// ── plan builder actions ──
let DRAG=null;
function dragStart(e,fid){DRAG=fid;e.dataTransfer.effectAllowed='copy';try{e.dataTransfer.setData('text/plain',fid);}catch(x){}e.target.classList.add('dragging');}
function dragEnd(e){e.target.classList.remove('dragging');DRAG=null;}
function dragOver(e,pid){e.preventDefault();const z=document.getElementById('dz_'+pid);if(z)z.classList.add('over');}
function dragLeave(e,pid){const z=document.getElementById('dz_'+pid);if(z)z.classList.remove('over');}
function dropFeat(e,pid){e.preventDefault();let fid=DRAG;try{fid=e.dataTransfer.getData('text/plain')||DRAG;}catch(x){}
  const p=APP.plans.find(x=>x.id===pid);if(p&&fid&&!p.features.includes(fid))p.features.push(fid);render();}
function removeFeat(pid,fid){const p=APP.plans.find(x=>x.id===pid);if(p)p.features=p.features.filter(f=>f!==fid);render();}
function setLimit(pid,key,val){const p=APP.plans.find(x=>x.id===pid);if(p)p.limits[key]=Math.max(0,parseInt(val||0,10));}
function setBadge(pid,key,val){const p=APP.plans.find(x=>x.id===pid);if(p)p.badges[key]=Math.max(0,parseInt(val||0,10));}
function addPlan(){APP.plans.push({id:'p'+Date.now(),nameKey:'pl_new',price:3,color:'#6366F1',features:[],limits:{qDay:0,groups:0,tests:1},badges:{login:1,purchase:0,correct:1}});render();}
function savePlans(){alert(APP.lang==='es'?'Cambios guardados (demo)':'Changes saved (demo)');}

// ── nav / render ──
function go(v){APP.view=v;toggleSidebar(false);render();}
function toggleSidebar(open){document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('scrim').classList.toggle('open',open);}
function setLang(l){APP.lang=l;document.getElementById('langSel').value=l;document.documentElement.lang=l;render();}
function toggleTheme(){APP.dark=!APP.dark;document.body.classList.toggle('dark',APP.dark);document.getElementById('themeBtn').textContent=APP.dark?'☀️':'🌙';render();}
function renderNav(){
  document.getElementById('nav').innerHTML=
    `<div class="nav-sec">${L('nav_grp1')}</div>`+NAV.slice(0,3).map(([id,ic])=>navItem(id,ic)).join('')+
    `<div class="nav-sec">${L('nav_grp2')}</div>`+NAV.slice(3).map(([id,ic])=>navItem(id,ic)).join('');
}
function navItem(id,ic){
  let badge='';
  if(id==='operativa'){const n=APP.services.filter(s=>s.state==='down').length;if(n)badge=`<span class="badge">${n}</span>`;}
  if(id==='usuarios'){const n=APP.tickets.filter(t=>t.state!=='closed').length;if(n)badge=`<span class="badge" style="background:var(--cta);color:#1A365D">${n}</span>`;}
  return `<div class="nav-item ${APP.view===id?'act':''}" onclick="go('${id}')"><span class="ico">${ic}</span>${L('nav_'+id)}${badge}</div>`;
}
function render(){
  renderNav();
  document.getElementById('pageTitle').textContent=L('nav_'+APP.view);
  document.getElementById('consoleLbl').textContent=L('console');
  document.getElementById('roleLbl').textContent=L('role');
  document.getElementById('main').innerHTML=(V[APP.view]||V.resumen)();
}
render();
</script>
</body>
</html>
